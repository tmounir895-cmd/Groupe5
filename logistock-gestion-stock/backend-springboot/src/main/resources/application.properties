spring.application.name=logistock-backend
server.port=8080

# Les secrets sont dans application-local.properties (fichier ignore par Git)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/logistocksa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origins=http://localhost:4200

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=480

app.bootstrap-admin.email=admin@logistock.sa
app.bootstrap-admin.nom=Administrateur
app.bootstrap-admin.password=